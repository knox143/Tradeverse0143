<!-- Local development password reset page; production should use verified email tokens. -->
{% extends 'base.html' %}
{% block content %}
<section class="auth-panel compact-auth-panel">
    <a class="back-link" href="{{ url_for('login') }}"><i data-lucide="arrow-left"></i>Back to sign in</a>
    <div class="auth-brand"><span class="brand-mark" aria-hidden="true"><i data-lucide="key-round"></i></span><strong>Trade<span>Verse</span></strong></div>
    <p class="eyebrow">Local reset</p>
    <h1>Set a new password.</h1>
    <p class="auth-copy">This development version resets a password directly. Production deployments should send a verified reset link instead.</p>
    <form method="post" class="auth-form" novalidate>
        <label class="field-label" for="email">Account email</label>
        <input class="field-input" id="email" name="email" type="email" autocomplete="email" required autofocus>
        <label class="field-label" for="new_password">New password</label>
        <input class="field-input" id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
        <button class="primary-button full-button" type="submit"><i data-lucide="key-round"></i>Update password</button>
    </form>
</section>
<aside class="auth-aside quiet-aside" aria-hidden="true"><div class="aside-brand">TradeVerse</div><p class="aside-footer">Back to steady practice.</p></aside>
{% endblock %}
